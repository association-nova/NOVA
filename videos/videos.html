<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آرشیو ویدیوها | انجمن نجوم نوا</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css?v=8">
<script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nova-theme')||'dark'}catch(e){}</script>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="../index.html"><img src="../assets/icons/nova-light.png" alt="لوگوی نوا" width="42" height="42"><span><b>نوا</b><small>آرشیو ویدیوها</small></span></a>
    <a class="btn ghost small" href="../index.html#videos">← بازگشت به صفحه‌ی اصلی</a>
    <button class="tg" id="themeBtn" type="button" aria-label="تغییر حالت شب و روز"><span>☀</span><span>☾</span></button>
  </div>
</header>

<main class="wrap vpage">
  <div class="vhead">
    <h1>🎞 آرشیو ویدیوهای نوا</h1>
    <p>گزارش‌ها، آموزش‌ها و وبینارهای انجمن نجوم نوا؛ همه‌ی آن‌ها یک‌جا.</p>
  </div>
  <div class="vlist" id="vlist"><noscript><p>برای دیدن ویدیوها جاوااسکریپت را فعال کنید یا به <a href="https://www.aparat.com/nova_astro_405">کانال آپارات</a> بروید.</p></noscript></div>
</main>

<footer>
  <div class="wrap foot">
    <span>© انجمن نجوم نوا · همه‌ی حقوق محفوظ است.</span>
    <div class="soc" data-social></div>
  </div>
</footer>

<script src="../assets/js/videos-data.js?v=8"></script>
<script src="../assets/js/social.js?v=8"></script>
<script>
(function () {
  var root = document.documentElement;
  document.getElementById('themeBtn').onclick = function () {
    var t = root.dataset.bsTheme === 'dark' ? 'light' : 'dark';
    root.dataset.bsTheme = t;
    try { localStorage.setItem('nova-theme', t); } catch (e) {}
  };
  var box = document.getElementById('vlist');
  (window.NOVA_VIDEOS || []).forEach(function (v) {
    var row = document.createElement('article');
    row.className = 'panel vrow'; row.id = v.id;
    var player = document.createElement('div'); player.className = 'vplayer';
    var fr = document.createElement('iframe');
    fr.src = 'https://www.aparat.com/video/video/embed/videohash/' + encodeURIComponent(v.id) + '/vt/frame';
    fr.title = v.title; fr.loading = 'lazy'; fr.allowFullscreen = true;
    player.appendChild(fr);
    var info = document.createElement('div'); info.className = 'vinfo';
    var tag = document.createElement('span'); tag.className = 'vtag'; tag.textContent = v.tag;
    var h = document.createElement('h2'); h.textContent = v.title;
    info.append(tag, h);
    if (v.desc) { var p = document.createElement('p'); p.textContent = v.desc; info.appendChild(p); }
    var by = document.createElement('p'); by.className = 'vby';
    by.textContent = v.role + ': ' + v.who; info.appendChild(by);
    row.append(player, info); box.appendChild(row);
  });
  if (location.hash) {
    var t = document.getElementById(location.hash.slice(1));
    if (t) setTimeout(function () { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
  }
})();
</script>
</body>
</html>
